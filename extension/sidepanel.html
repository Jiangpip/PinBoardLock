<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>PinBoardLock 调研单</title>
  <style>
    :root{--bg:#ECE6D8;--panel:#F6F1E6;--ink:#16140F;--mut:#7A7468;--line:#D8D0BD;--acc:#E4451C;--ok:#1E7A4C;--warn:#B26A00}
    *{box-sizing:border-box}
    html,body{margin:0;padding:0;height:100%}
    body{background:var(--bg);color:var(--ink);font:13px/1.4 "Segoe UI","Microsoft YaHei UI",system-ui,sans-serif;display:flex;flex-direction:column;min-width:280px}
    button{font:inherit;color:inherit;cursor:pointer}
    .mono{font-family:"Cascadia Mono",Consolas,ui-monospace,monospace;font-size:10px;letter-spacing:.08em;text-transform:uppercase}
    .head{display:flex;align-items:center;gap:8px;padding:10px 12px 8px;border-bottom:1.5px solid var(--ink)}
    .brand{font-family:"Cascadia Mono",Consolas,monospace;font-weight:700;font-size:12px;letter-spacing:.12em;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .brand i{color:var(--acc);font-style:normal}
    .btn{border:1.5px solid var(--ink);background:var(--panel);padding:4px 9px;white-space:nowrap}
    .btn:hover{background:var(--ink);color:var(--panel)}
    .btn.go{background:var(--ink);color:var(--panel)}
    .btn.go:hover{background:var(--acc);border-color:var(--acc)}
    .btn[disabled]{opacity:.5;cursor:default;pointer-events:none}
    .lnk{background:none;border:none;padding:0;text-decoration:underline;font-size:12px;color:var(--ink)}
    .lnk.danger{color:var(--acc)}

    .pick{display:flex;gap:6px;align-items:center;padding:8px 12px 0}
    .pick select{flex:1;min-width:0;font:inherit;font-weight:600;color:var(--ink);padding:5px 6px;border:1.5px solid var(--ink);background:var(--panel);outline:none}
    .sub{display:flex;gap:12px;align-items:center;padding:5px 12px 0;color:var(--mut);font-size:12px}
    .sub .sp{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

    .tgt{margin:9px 12px 0;padding:8px 10px;background:var(--panel);border:1.5px solid var(--ink);box-shadow:3px 3px 0 var(--ink)}
    .tgt.off{box-shadow:none;border-style:dashed;color:var(--mut)}
    .tgt .t1{font-weight:600;font-size:14px;word-break:break-all;margin-top:1px}
    .tgt .t2{color:var(--mut);font-size:12px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .tgt .t2 b{color:var(--ink)}

    .note{margin:9px 12px 0;padding:7px 9px;border-left:4px solid var(--warn);background:var(--panel);font-size:12px}
    .note.err{border-left-color:var(--acc)}
    .note.ok{border-left-color:var(--ok)}
    .note .row{display:flex;gap:8px;align-items:center;margin-top:6px;flex-wrap:wrap}
    .note ul{margin:4px 0 0;padding-left:18px}
    .seg{display:inline-flex;border:1.5px solid var(--ink)}
    .seg button{border:none;background:var(--panel);padding:2px 8px;font-size:12px}
    .seg button.on{background:var(--ink);color:var(--panel)}

    .list{flex:1;min-height:0;overflow-y:auto;padding:10px 12px 14px}
    .card{background:var(--panel);border:1.5px solid var(--ink);margin-bottom:10px}
    .card.cur{box-shadow:3px 3px 0 var(--ink)}
    .card .ch{display:flex;align-items:center;gap:8px;padding:6px 9px;border-bottom:1px solid var(--line)}
    .card.cur .ch{background:var(--ink);color:var(--panel)}
    .card .gn{font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .tag{font-family:"Cascadia Mono",Consolas,monospace;font-size:10px;letter-spacing:.04em;border:1px solid currentColor;padding:0 5px;line-height:16px;flex:none;white-space:nowrap}
    .tag.miss{color:var(--acc)}
    .card.cur .tag.miss{color:#FF9A7A}
    .card .gnote{padding:5px 9px 0;color:var(--mut);font-size:12px}
    .kws{display:flex;flex-wrap:wrap;gap:5px;padding:8px 9px 9px}
    .kw{border:1px solid var(--ink);background:var(--panel);padding:3px 8px;text-align:left;display:inline-flex;align-items:center;gap:6px;max-width:100%}
    .kw span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .kw:hover{background:#EAE2CF}
    .kw.seen{background:#E3DCCB;color:#5B564B;border-color:#9A9384}
    .kw.cur{background:var(--acc);border-color:var(--acc);color:#fff}
    .kw em{font-style:normal;font-family:"Cascadia Mono",Consolas,monospace;font-size:10px;background:var(--ink);color:var(--panel);padding:0 4px;line-height:15px;flex:none}
    .kw.cur em{background:#fff;color:var(--acc)}

    .foot{border-top:1.5px solid var(--ink);padding:7px 12px;display:flex;align-items:center;gap:8px}
    .foot .mid{flex:1;text-align:center;color:var(--mut)}

    .btn.hot{border-color:var(--acc);color:var(--acc);font-weight:600}
    .btn.hot:hover{background:var(--acc);color:#fff}
    .btn.wide{flex:1;text-align:center;font-weight:600}
    .note .cmd,.cmd{margin-top:5px;padding:5px 7px;background:var(--ink);color:var(--panel);font:11px/1.4 "Cascadia Mono",Consolas,monospace;word-break:break-all;user-select:all}

    .sync{border-top:1.5px solid var(--ink);padding:8px 12px;background:var(--panel)}
    .sync .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
    .sync .prog + .row,.sync input + .sd + .row,.sync .sum + .row,.sync .sd + .row{margin-top:8px}
    .sync input{width:100%;margin-top:4px;font:12px/1.4 "Cascadia Mono",Consolas,monospace;color:var(--ink);padding:5px 7px;border:1.5px solid var(--ink);background:var(--bg);outline:none}
    .sync input:focus{border-color:var(--acc)}
    .sync .sd{color:var(--mut);font-size:12px;margin-top:4px;word-break:break-all}
    .sync .sd.warn{color:var(--warn)}
    .sync .sum{margin-top:7px;padding:5px 8px;border-left:4px solid var(--ok);background:var(--bg);font-size:12px;font-weight:600}
    .sync .sum.err{border-left-color:var(--acc);font-weight:400}
    .st{display:flex;gap:8px;align-items:flex-start;margin-top:6px}
    .st .mk{width:16px;height:16px;flex:none;text-align:center;font:700 12px/16px "Cascadia Mono",Consolas,monospace;color:var(--mut)}
    .st .sx{min-width:0;flex:1}
    .st .sl{font-weight:600}
    .st .sd{margin-top:1px}
    .st.todo .sl,.st.skip .sl{color:var(--mut);font-weight:400}
    .st.ok .mk{color:var(--ok)}
    .st.run .mk{color:var(--ink);animation:spin 1.2s linear infinite}
    .st.wait .mk,.st.err .mk{background:var(--acc);color:#fff}
    .st.wait .sd{color:var(--ink);font-weight:600}
    .st.err .sd{color:var(--acc)}
    @keyframes spin{to{transform:rotate(360deg)}}

    .util{border-top:1px solid var(--line);padding:5px 12px 6px;display:flex;align-items:center;gap:12px;color:var(--mut)}
    .util .sp{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .util .lnk{font-size:11px;white-space:nowrap}

    .imp{flex:1;min-height:0;overflow-y:auto;padding:12px}
    .imp h2{margin:0 0 4px;font-size:15px}
    .imp p{margin:0 0 9px;color:var(--mut);font-size:12px}
    .imp ol{margin:0 0 10px;padding-left:18px;font-size:12px}
    .imp ol li{margin-bottom:3px}
    .imp textarea{width:100%;height:190px;resize:vertical;font:12px/1.4 "Cascadia Mono",Consolas,monospace;color:var(--ink);padding:7px 8px;border:1.5px solid var(--ink);background:var(--panel);outline:none}
    .imp textarea:focus{border-color:var(--acc)}
    .imp .row{display:flex;gap:6px;align-items:center;margin-top:8px;flex-wrap:wrap}
    .imp .res{margin-top:8px;padding:6px 8px;border-left:4px solid var(--ok);background:var(--panel);font-size:12px}
    .imp .res.err{border-left-color:var(--acc)}
    [hidden]{display:none !important}
  </style>
</head>
<body>
  <div id="root" style="display:contents"></div>
  <script src="sheet.js"></script>
  <script src="sidepanel.js"></script>
</body>
</html>
